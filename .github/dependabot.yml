version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1; lift this once it supports 7.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
