name: End-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # GitHub runners render WebGL in software; the frame-rate floor is relaxed accordingly.
      E2E_MIN_FPS: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/*.png
          retention-days: 7
