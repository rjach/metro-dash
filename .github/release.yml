# Categories for auto-generated release notes (by PR label).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Performance
      labels: [performance]
    - title: Bug fixes
      labels: [bug]
    - title: Camera controls
      labels: [camera]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
